name: Scrape Configs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          echo "▶ نصب کتابخانه‌ها..."
          pip install -r requirements.txt
          echo "▶ تست import:"
          python -c "import telethon; print('telethon:', telethon.__version__)"

      - name: Check secrets
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: |
          echo "▶ چک کردن Secrets:"
          if [ -z "$API_ID" ]; then echo "❌ API_ID خالی است!"; else echo "✅ API_ID موجود (طول: ${#API_ID})"; fi
          if [ -z "$API_HASH" ]; then echo "❌ API_HASH خالی است!"; else echo "✅ API_HASH موجود (طول: ${#API_HASH})"; fi
          if [ -z "$SESSION_STRING" ]; then echo "❌ SESSION_STRING خالی است!"; else echo "✅ SESSION_STRING موجود (طول: ${#SESSION_STRING})"; fi

      - name: Run scraper
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: |
          echo "▶ شروع اجرای اسکریپت:"
          python -u main.py
          echo "▶ پایان اجرا (exit code: $?)"

      - name: Check output
        if: always()
        run: |
          echo "▶ محتوای پوشه:"
          ls -la
          echo "▶ آیا sub.txt وجود دارد؟"
          if [ -f sub.txt ]; then
            echo "✅ بله، محتوا:"
            head -5 sub.txt
          else
            echo "❌ نه، فایل ساخته نشده."
          fi

      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sub.txt ]; then
            git add sub.txt
            if git diff --staged --quiet; then
              echo "بدون تغییر"
            else
              git commit -m "update sub.txt [skip ci]"
              git push
            fi
          else
            echo "⚠️ فایل sub.txt نیست، چیزی برای commit کردن نداریم."
          fi
